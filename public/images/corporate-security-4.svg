
    <svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#d4af37;stop-opacity:0.3" />
          <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
        </linearGradient>
        <pattern id="grid3" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.1"/>
        </pattern>
        <filter id="blur3">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
        </filter>
      </defs>
      
      <!-- Background -->
      <rect width="1920" height="1080" fill="url(#bg3)"/>
      
      <!-- Grid Pattern -->
      <rect width="1920" height="1080" fill="url(#grid3)"/>
      
      <!-- Security-themed elements -->
      <g opacity="0.15">
        <!-- Shield shape -->
        <path d="M 960 200 L 1100 300 L 1100 500 L 960 600 L 820 500 L 820 300 Z" 
              fill="#ffd700" filter="url(#blur3)"/>
        
        <!-- Security lines -->
        <line x1="200" y1="300" x2="1720" y2="300" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
        <line x1="200" y1="780" x2="1720" y2="780" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
        <line x1="960" y1="100" x2="960" y2="980" stroke="#ffd700" stroke-width="1" opacity="0.2"/>
        
        <!-- Corner elements -->
        <rect x="50" y="50" width="100" height="100" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
        <rect x="1770" y="50" width="100" height="100" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
        <rect x="50" y="930" width="100" height="100" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
        <rect x="1770" y="930" width="100" height="100" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
      </g>
      
      <!-- Text overlay (subtle) -->
      <text x="960" y="540" font-family="Arial, sans-serif" font-size="120" font-weight="bold" 
            text-anchor="middle" fill="#ffd700" opacity="0.05">
        SECURITY
      </text>
    </svg>
  